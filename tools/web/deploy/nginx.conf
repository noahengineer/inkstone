# The Inkstone reader behind nginx, for a server that already runs one.
#
# Caddy (see Caddyfile beside this) is the easier answer because it handles certificates itself.
# This is here for a machine that already terminates TLS in nginx.

server {
    listen 443 ssl;
    http2 on;
    server_name notes.example.com;

    ssl_certificate     /etc/letsencrypt/live/notes.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/notes.example.com/privkey.pem;

    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

    # A published note can be a large PDF and a lecture is ~15 MB; nothing is uploaded, so this
    # only needs to be generous in the response direction.
    client_max_body_size 4m;

    location / {
        proxy_pass http://reader:8765;
        proxy_http_version 1.1;

        # ⚠️ `Host` must be passed through unchanged. The reader checks it against
        # INKSTONE_ALLOWED_HOSTS as its DNS-rebinding defence, and nginx's default is to send the
        # upstream's name — which would make every request arrive claiming to be from `reader`
        # and be refused. This one line is the likeliest reason a working config starts 403ing.
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # ⚠️ Off, for the PDFs. Buffering defeats byte ranges, so a browser's built-in PDF
        # viewer would pull a whole lecture note through nginx before showing its first page.
        # (This said *audio* until the player was removed; the reason outlived it — `/media/note`
        # is served with `Accept-Ranges` and a note is megabytes.)
        proxy_buffering off;

        # A slow Nextcloud walk on a cold cache can take a while; the default 60s read timeout
        # turns that into a 504 on the very first page load, which reads as "it doesn't work".
        proxy_read_timeout 300s;
    }
}

# Plain HTTP exists only to send people to HTTPS. The session cookie is `Secure`, so it is never
# sent over this and a sign-in here would appear to succeed and then not stick.
server {
    listen 80;
    server_name notes.example.com;
    return 301 https://$host$request_uri;
}
