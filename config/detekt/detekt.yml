# Overrides on top of detekt's default config (buildUponDefaultConfig = true).
# Kept small on purpose — M0 should not spend its budget arguing with a linter.

build:
  maxIssues: 0

complexity:
  LongParameterList:
    functionThreshold: 8
    constructorThreshold: 10
  TooManyFunctions:
    # KMP expect/actual and Compose files legitimately hold many small functions.
    thresholdInFiles: 20
    # A custom View that owns MotionEvent dispatch is the shape this rule is
    # worst at judging. InkSurfaceView's members are lifecycle, camera, strokes,
    # history, and one small named handler per input transition — which is the
    # readable form, and collapsing them into fewer, larger methods to satisfy a
    # count would make the ink path harder to follow. Everything with state of
    # its own has already been extracted: gestures, erasing, palm rejection,
    # taps and the camera matrix are all separate classes.
    # M2 added the op-log surface to InkSurfaceView: bind a page, load one, drain the
    # recorder, apply ops. Four functions, each with a distinct owner on the other side.
    # M6 added one more: setPageMeta, which changes the paper and the page's extent without
    # refitting the camera or cancelling the in-progress stroke. It cannot fold into loadPage
    # — loadPage does both of those deliberately, and the whole point of the new method is that
    # it does neither (SPEC §13.2 row 10).
    # M7 added one more to InkSurfaceView — highlight, which marks a search hit's box and
    # brings it into view (SPEC §8.4) — and three to NoteSession, which are one cohesive
    # sub-API rather than three unrelated members: recognisedText reads a page's text and
    # re-checks its ink digest, recognised records a pass, reconcileText settles a peer's copy
    # against the merged page (SPEC §5.5). They cannot be one function; they have three
    # different callers and only one of them may write.
    thresholdInClasses: 30
    # A codec is one small function per type it encodes, by construction — OpCodec has a
    # writer and a reader for each of the seven op kinds and four object kinds. Collapsing
    # them into fewer, larger functions would make the format harder to check against
    # SPEC §5.3, which is the only thing that matters about this file.
    thresholdInObjects: 20
    ignoreAnnotatedFunctions: ['Composable']

style:
  ReturnCount:
    # MotionEvent dispatch is guard clauses all the way down: is it a stylus, is
    # it a palm, is a stroke already live. Rewriting those as nested ifs to reach
    # a single exit would make the ink path harder to read, not safer — and the
    # ink path is the one place in this app where reading it easily matters most
    # (CLAUDE.md rule 7).
    max: 5
  MagicNumber:
    ignorePropertyDeclaration: true
    ignoreCompanionObjectPropertyDeclaration: true
  MaxLineLength:
    maxLineLength: 120
    excludeCommentStatements: true
  ForbiddenComment:
    # TODO(Mn) markers are how open work is tracked against the roadmap.
    active: false
  UnusedPrivateMember:
    active: true

exceptions:
  TooGenericExceptionCaught:
    active: true
  SwallowedException:
    active: true

naming:
  FunctionNaming:
    ignoreAnnotated: ['Composable']

potential-bugs:
  # CLAUDE.md: no `!!` outside tests. Model it so it cannot be null instead.
  UnsafeCallOnNullableType:
    active: true
