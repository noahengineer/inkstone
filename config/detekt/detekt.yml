# Overrides on top of detekt's default config (buildUponDefaultConfig = true).
# Kept small on purpose — M0 should not spend its budget arguing with a linter.

build:
  maxIssues: 0

complexity:
  LargeClass:
    # The same two classes TooManyFunctions argues about below, and the same argument — measured
    # this time. Snap-to-grid added about ten statements to InkSurfaceView (one setting, one
    # function that puts three collaborators back in step with the paper) and about ten to
    # SelectionController (a lattice per gesture, applied in the move, the resize and the point
    # drag). Both classes were a handful of statements under 600 before it and both are over now,
    # which was confirmed by stripping exactly those additions and watching the rule go quiet.
    #
    # The rule's advice — *"consider splitting it into smaller pieces"* — has already been taken
    # as far as it goes: gestures, erasing, palm rejection, taps, the ruler, the laser, the shape
    # snap detector and the camera matrix are all separate classes, and everything decidable is
    # in `:core:model` as a pure function. What is left in InkSurfaceView is MotionEvent dispatch,
    # and in SelectionController one gesture's state; splitting either by statement count would
    # put half of one input transition in another file, which is the thing this repo can least
    # afford to make harder to read.
    #
    # 700 rather than "off": it is roughly one more feature's worth of headroom, so the next
    # thing to cross it has to make this argument again rather than inherit it.
    threshold: 700
  LongParameterList:
    functionThreshold: 8
    constructorThreshold: 10
    # M10. A Compose component's *optional* parameters are a styling surface, not an argument
    # list a caller has to get right in order — `TextChip(label, onClick)` is the whole API and
    # `selected`, `enabled`, `danger`, `verbatim`, `contentDescription`, `modifier` are knobs that
    # are always named at the call site because they have defaults. The confusion this rule exists
    # to catch is positional: six unlabelled arguments in a row. Counting only the required ones
    # keeps that protection and stops the rule from arguing against giving a component a
    # `contentDescription` — which is the parameter that tipped `TextChip` over, and the one that
    # makes a glyph chip reachable by TalkBack and by `uiautomator dump`.
    ignoreDefaultParameters: true
  TooManyFunctions:
    # KMP expect/actual and Compose files legitimately hold many small functions.
    thresholdInFiles: 20
    # A custom View that owns MotionEvent dispatch is the shape this rule is
    # worst at judging. InkSurfaceView's members are lifecycle, camera, strokes,
    # history, and one small named handler per input transition — which is the
    # readable form, and collapsing them into fewer, larger methods to satisfy a
    # count would make the ink path harder to follow. Everything with state of
    # its own has already been extracted: gestures, erasing, palm rejection,
    # taps and the camera matrix are all separate classes.
    # M2 added the op-log surface to InkSurfaceView: bind a page, load one, drain the
    # recorder, apply ops. Four functions, each with a distinct owner on the other side.
    # M6 added one more: setPageMeta, which changes the paper and the page's extent without
    # refitting the camera or cancelling the in-progress stroke. It cannot fold into loadPage
    # — loadPage does both of those deliberately, and the whole point of the new method is that
    # it does neither (SPEC §13.2 row 10).
    # M7 added one more to InkSurfaceView — highlight, which marks a search hit's box and
    # brings it into view (SPEC §8.4) — and three to NoteSession, which are one cohesive
    # sub-API rather than three unrelated members: recognisedText reads a page's text and
    # re-checks its ink digest, recognised records a pass, reconcileText settles a peer's copy
    # against the merged page (SPEC §5.5). They cannot be one function; they have three
    # different callers and only one of them may write.
    thresholdInClasses: 30
    # `InkSelection` is a facade over one gesture each: delete, duplicate, recolour, set width,
    # front, back, clear, fill, corner radius, route, regularise, arrowhead, snap-to-grid. Every
    # one is a button on the selection bar and a single `applyAsGesture` on the other side, so the
    # count is the *toolbar's* size and not a sign the type does too much — collapsing them into
    # fewer, wider methods (`apply(action, argument)`) would make the wrong call representable,
    # which is the trap `NoteSession.apply`'s deleted `undoable` flag is this repo's standing
    # lesson about. 15 rather than "off": another three and the bar itself needs the review.
    thresholdInInterfaces: 15
    # A codec is one small function per type it encodes, by construction — OpCodec has a
    # writer and a reader for each of the seven op kinds and four object kinds. Collapsing
    # them into fewer, larger functions would make the format harder to check against
    # SPEC §5.3, which is the only thing that matters about this file.
    thresholdInObjects: 20
    ignoreAnnotatedFunctions: ['Composable']

style:
  ReturnCount:
    # MotionEvent dispatch is guard clauses all the way down: is it a stylus, is
    # it a palm, is a stroke already live. Rewriting those as nested ifs to reach
    # a single exit would make the ink path harder to read, not safer — and the
    # ink path is the one place in this app where reading it easily matters most
    # (CLAUDE.md rule 7).
    max: 5
  MagicNumber:
    ignorePropertyDeclaration: true
    ignoreCompanionObjectPropertyDeclaration: true
  MaxLineLength:
    maxLineLength: 120
    excludeCommentStatements: true
  ForbiddenComment:
    # TODO(Mn) markers are how open work is tracked against the roadmap.
    active: false
  UnusedPrivateMember:
    active: true

exceptions:
  TooGenericExceptionCaught:
    active: true
  SwallowedException:
    active: true

naming:
  FunctionNaming:
    ignoreAnnotated: ['Composable']

potential-bugs:
  # CLAUDE.md: no `!!` outside tests. Model it so it cannot be null instead.
  UnsafeCallOnNullableType:
    active: true
