# Inkstone version catalog — SPEC §0.2.
#
# Every coordinate below was resolved against Google Maven / Maven Central on
# 2026-08-05. Do not upgrade or substitute. If one stops resolving, report the
# actual available version with a link to its release page and STOP (SPEC §0.2).
#
# Deliberately absent, and why:
#   okhttp / dav4jvm as :core:* commonMain deps  — JVM-only, would kill iOS (SPEC §0.1 #4).
#                                                  OkHttp appears only as Ktor's Android engine.
#   androidx.room / room3                        — Room 3.0 is not stable (SPEC §0.2).
#   androidx.security:security-crypto            — EncryptedSharedPreferences deprecated 2025 (SPEC §14).
#   any Samsung SDK                              — dead since Sep 2019 (SPEC §0.1 #2).
#   androidx.ink *-compose artifacts             — see the note on `androidxInk` below.

[versions]
# ---- Build toolchain -------------------------------------------------------
kotlin = "2.3.20"
agp = "8.13.0"
# KSP moved to its own version line after 2.2.21-2.0.5; 2.3.11 depends on
# kotlin-stdlib 2.3.20, which is the alignment we need.
ksp = "2.3.11"

compileSdk = "36"
targetSdk = "36"
minSdk = "30"

# ---- Ink (M1) --------------------------------------------------------------
# STABLE 1.0.0, not alpha (SPEC §0.1 #1). Do not move to 1.1.0-alpha06:
# an alpha in the most important code path is a bad trade (SPEC §3.2), and the
# ink-*-compose artifacts are not uniformly published on the 1.0.0 line
# (ink-authoring-compose:1.0.0 exists, ink-rendering-compose:1.0.0 is a 404),
# which is why Google's own Compose snippet does not resolve.
androidxInk = "1.0.0"
graphicsCore = "1.0.4"
inputMotionPrediction = "1.0.0"

# ---- Platform --------------------------------------------------------------
# ⚠️ "Latest stable" here means "latest stable that works with AGP 8.13.0 and
# compileSdk 36" (SPEC §0.2 pins both). The androidx ecosystem has moved on to
# AGP 9.1.0 / compileSdk 37, so several artifacts' newest releases are NOT
# usable. Read from each AAR's own aar-metadata.properties:
#
#   core-ktx                 1.18.0 -> minCompileSdk 36, minAGP 8.9.1   OK
#                            1.19.0 -> minCompileSdk 37, minAGP 9.1.0   NO
#   lifecycle                2.10.0 -> minCompileSdk 35, minAGP 8.6.0   OK
#                            2.11.0 -> minCompileSdk 37, minAGP 9.1.0   NO
#   hilt-navigation-compose  1.3.0  -> minCompileSdk 35, minAGP 8.6.0   OK
#                            1.4.0  -> minCompileSdk 37, minAGP 9.1.0   NO
#   activity-compose         1.13.0 -> minCompileSdk 36, minAGP 8.9.1   OK (latest)
#
# Before bumping any of these, check aar-metadata.properties. A version that
# resolves is not the same as a version that builds.
composeBom = "2026.06.01"
activityCompose = "1.13.0"
coreKtx = "1.18.0"
lifecycle = "2.10.0"
work = "2.11.2"
# NOT the latest (2.60.1). Measured against AGP 8.13.0, which SPEC §0.2 pins:
#   2.59.1 .. 2.60.1  hard-fail at apply time: "only compatible with AGP 9.0.0+"
#   2.59              applies, then dies configuring :app with
#                     NoClassDefFoundError ScopedArtifact$POST_COMPILATION_CLASSES.
#                     Its declared minimum still says 8.4.0 — the version check
#                     is stale, so the failure is a missing class, not a message.
#   2.58              works. This is the real ceiling for AGP 8.x.
# Do not "fix" a Hilt upgrade by bumping AGP. That is a spec change, not a
# version bump — and AGP is what the whole toolchain is pinned around.
hilt = "2.58"
hiltNavigationCompose = "1.3.0"
annotation = "1.10.0"
# M5. Custom Tabs for SPEC §7.1's login flow — "open `login` in a Custom Tab", so the
# user approves in a browser that already holds their Nextcloud session instead of typing
# a password on a tablet. Checked against its own aar-metadata.properties before pinning,
# per SPEC §0.2's warning that resolving is not the same as building:
#   browser 1.10.0 -> minCompileSdk 36, minAGP 8.9.1   OK (latest stable)
#   browser  1.8.0 -> minCompileSdk 34, minAGP 1.0.0   also fine, but older for no gain
browser = "1.10.0"

# ---- Data ------------------------------------------------------------------
sqldelight = "2.3.2"
ktor = "3.5.0"
kotlinxSerialization = "1.11.0"
kotlinxCoroutines = "1.11.0"
okio = "3.18.1"

# ---- Features (declared now so M0 proves they resolve) ---------------------
mlkitDigitalInk = "19.0.0"
androidxPdf = "1.0.0-alpha19"
# Fallback PDF writer, pending the M4.0 spike. Dormant since Jan 2023 (SPEC §6.3).
pdfboxAndroid = "2.0.27.0"

# ---- Quality / test --------------------------------------------------------
detekt = "1.23.8"
spotless = "8.9.0"
ktlint = "1.8.0"
junit = "4.13.2"
androidxTestJunit = "1.3.0"
androidxTestCore = "1.7.0"
# The class `testInstrumentationRunner` names. NOT transitive from androidx.test.ext:junit,
# which is how every instrumented test in this project failed to start the first time one
# was actually run (M5, on an emulator). Ships no aar-metadata.properties, so it imposes no
# compileSdk or AGP floor; 1.7.0 matches the androidx.test:core pin above.
androidxTestRunner = "1.7.0"
espresso = "3.7.0"

