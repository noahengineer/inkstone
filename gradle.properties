org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

# Configuration cache is deliberately OFF for M0. KSP + Hilt + SQLDelight +
# KMP is a lot of plugins to bring under it at once, and a green, boring M0 is
# worth more than a fast one. Turning it on is an M9 (performance) task.
org.gradle.configuration-cache=false

android.useAndroidX=true
android.nonTransitiveRClass=true

kotlin.code.style=official

# Kotlin/Native cannot build Apple targets on Windows or Linux. Without this,
# declaring iosArm64/iosSimulatorArm64 fails the configuration phase on a
# non-Mac host instead of simply skipping those tasks. Guardrail 2 therefore
# runs on the macOS CI runner (.github/workflows/ci.yml), not locally on Windows.
kotlin.native.ignoreDisabledTargets=true

# Suppresses the "expect/actual classes are in Beta" nag; we use expect/actual
# functions only, but SQLDelight and Ktor drivers can surface it transitively.
kotlin.mpp.stability.nowarn=true
